<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Spend Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6EEDD; --cream-deep:#EFE4CC; --paper:#FFFBF2;
    --ink:#3D342A; --ink-soft:#8A7C68; --gold:#B98A2E;
    --gold-bright:#D4A63C; --gold-pale:#F0E4C4; --line:#E5D8BE;
    --olive:#6E7A4F; --rust:#B15533;
    --shadow:0 1px 2px rgba(61,52,42,.06),0 8px 24px rgba(61,52,42,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);
    background:var(--cream);min-height:100vh;-webkit-font-smoothing:antialiased;
    padding:18px 12px 40px;
  }
  .wrap{max-width:680px;margin:0 auto}
  header.masthead{text-align:center;margin-bottom:16px}
  .eyebrow{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:5px}
  h1{font-family:"Playfair Display",serif;font-weight:600;font-size:2rem;line-height:1.05;margin:0 0 4px;color:var(--ink)}
  .subtitle{color:var(--ink-soft);font-size:.88rem}
  .rule{height:2px;width:56px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--gold-bright),transparent)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
  .hint{display:block;font-weight:400;color:var(--ink-soft);font-size:.76rem;margin-top:2px}
  input{
    width:100%;font-family:"DM Sans",sans-serif;font-size:1rem;color:var(--ink);
    background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:12px;
  }
  input:focus{outline:none;border-color:var(--gold-bright);box-shadow:0 0 0 3px rgba(212,166,60,.16)}
  .ledger-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px;gap:10px}
  .ledger-head h2{font-family:"Playfair Display",serif;font-weight:600;font-size:1.15rem;margin:0}
  .count-pill{font-size:.75rem;color:var(--ink-soft);background:var(--cream-deep);padding:3px 9px;border-radius:20px;white-space:nowrap}
  .entries{list-style:none;margin:0;padding:0}
  .entry{display:grid;grid-template-columns:minmax(0,1fr) 118px 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
  .entry:last-child{border-bottom:none}
  .entry input{background:var(--cream);padding:12px 10px}
  .amount-shell{position:relative}
  .amount-shell::before{content:"$";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none;z-index:1}
  .entry .amount{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;padding-left:24px;font-size:1.05rem}
  .del{border:none;background:transparent;cursor:pointer;color:#C9B79A;font-size:1.35rem;line-height:1;border-radius:8px;width:34px;height:42px}
  .del:hover,.del:focus{color:var(--rust);background:#F7E9E2;outline:none}
  .add-btn,.secondary-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;cursor:pointer;
    font-family:"DM Sans",sans-serif;font-size:.98rem;font-weight:700;color:var(--gold);background:var(--gold-pale);
    border:1px solid var(--line);border-radius:10px;
  }
  .add-btn{margin-top:14px}
  .add-btn:hover,.secondary-btn:hover{background:#EADFBF}
  .empty{text-align:center;color:var(--ink-soft);font-size:.9rem;padding:14px 0 6px;font-style:italic}
  .totals{background:linear-gradient(180deg,#FFFDF7,#FBF3E1);border:1px solid var(--gold-pale);text-align:center}
  .total-label{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:4px}
  .total-amount{font-family:"Playfair Display",serif;font-weight:700;font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--olive)}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .secondary-btn{background:transparent}
  .danger{color:var(--rust)}
  footer{text-align:center;color:#B7A788;font-size:.76rem;margin-top:22px}
  @media(max-width:480px){
    body{padding:12px 8px 30px}
    h1{font-size:1.75rem}
    .card{padding:13px;border-radius:12px}
    .entry{grid-template-columns:minmax(0,1fr) 105px 32px;gap:6px}
    .entry input{padding:12px 9px}
    .entry .amount{font-size:1rem;padding-left:22px}
    .amount-shell::before{left:8px}
    .actions{grid-template-columns:1fr}
    .total-amount{font-size:2.35rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="eyebrow">Vehicle Accounts</div>
    <h1>Vehicle Spend Record</h1>
    <div class="subtitle">Simple non-fuel expense tracking</div>
    <div class="rule"></div>
  </header>

  <div class="card">
    <label for="vehicleName">Vehicle <span class="hint">Name, model or registration</span></label>
    <input id="vehicleName" type="text" placeholder="e.g. 2004 Toyota Fielder">
  </div>

  <div class="card">
    <div class="ledger-head">
      <h2>Expenses</h2>
      <span class="count-pill" id="countPill">0 entries</span>
    </div>
    <ul class="entries" id="entries"></ul>
    <div class="empty" id="emptyMsg">No vehicle expenses recorded yet.</div>
    <button class="add-btn" id="addBtn">＋ Add an expense</button>
  </div>

  <div class="card totals">
    <div class="total-label">Total spent</div>
    <div class="total-amount" id="totalAmount">$0.00</div>
  </div>

  <div class="card actions">
    <button class="secondary-btn" id="exportBtn">Export as CSV</button>
    <button class="secondary-btn danger" id="clearBtn">Clear all records</button>
  </div>

  <footer>Saved automatically on this device • Amounts in NZD</footer>
</div>

<script>
(function(){
  "use strict";
  const KEY="vehicleSpendTracker_v1";
  const nzd=new Intl.NumberFormat("en-NZ",{style:"currency",currency:"NZD"});
  const money=n=>nzd.format(Number.isFinite(n)?n:0);
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  function blankState(){return{vehicleName:"",entries:[]}}
  function load(){
    try{
      const raw=localStorage.getItem(KEY);
      if(!raw)return blankState();
      const saved=JSON.parse(raw);
      return{
        vehicleName:saved.vehicleName||"",
        entries:Array.isArray(saved.entries)?saved.entries.map(e=>({
          id:e.id||uid(),
          desc:e.desc||"",
          amount:e.amount??""
        })):[]
      };
    }catch(e){return blankState()}
  }

  let state=load();
  const el=id=>document.getElementById(id);
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
  const total=()=>state.entries.reduce((sum,e)=>sum+(parseFloat(e.amount)||0),0);

  function render(){
    el("vehicleName").value=state.vehicleName||"";
    el("entries").innerHTML="";
    state.entries.forEach(e=>el("entries").appendChild(entryRow(e)));
    el("emptyMsg").style.display=state.entries.length?"none":"block";
    el("countPill").textContent=state.entries.length+(state.entries.length===1?" entry":" entries");
    renderTotal();
  }

  function entryRow(e){
    const li=document.createElement("li");
    li.className="entry";

    const desc=document.createElement("input");
    desc.type="text";
    desc.className="desc";
    desc.placeholder="Expense name";
    desc.value=e.desc||"";
    desc.setAttribute("aria-label","Expense name");
    desc.addEventListener("input",()=>{e.desc=desc.value;save()});

    const shell=document.createElement("div");
    shell.className="amount-shell";
    const amount=document.createElement("input");
    amount.type="number";
    amount.inputMode="decimal";
    amount.step="0.01";
    amount.min="0";
    amount.className="amount";
    amount.placeholder="0.00";
    amount.value=(e.amount===0||e.amount)?e.amount:"";
    amount.setAttribute("aria-label","Amount in New Zealand dollars");
    amount.addEventListener("input",()=>{e.amount=amount.value;save();renderTotal()});
    shell.appendChild(amount);

    const del=document.createElement("button");
    del.className="del";
    del.innerHTML="×";
    del.title="Remove this expense";
    del.setAttribute("aria-label","Remove this expense");
    del.addEventListener("click",()=>{
      state.entries=state.entries.filter(x=>x.id!==e.id);
      save();
      render();
    });

    li.append(desc,shell,del);
    return li;
  }

  function renderTotal(){
    el("totalAmount").textContent=money(total());
  }

  function addEntry(){
    state.entries.push({id:uid(),desc:"",amount:""});
    save();
    render();
    const rows=el("entries").querySelectorAll(".entry .desc");
    if(rows.length)rows[rows.length-1].focus();
  }

  function csvCell(value){return '"'+String(value??"").replace(/"/g,'""')+'"'}
  function exportCsv(){
    const rows=[["Vehicle",state.vehicleName],[],["Expense","Amount (NZD)"]];
    state.entries.forEach(e=>rows.push([e.desc,(parseFloat(e.amount)||0).toFixed(2)]));
    rows.push([], ["Total",total().toFixed(2)]);
    const csv=rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="vehicle-spend-record.csv";
    a.click();
    URL.revokeObjectURL(url);
  }

  el("vehicleName").addEventListener("input",e=>{state.vehicleName=e.target.value;save()});
  el("addBtn").addEventListener("click",addEntry);
  el("exportBtn").addEventListener("click",exportCsv);
  el("clearBtn").addEventListener("click",()=>{
    if(confirm("Clear the vehicle name and every expense record? This cannot be undone.")){
      state=blankState();
      save();
      render();
    }
  });
  render();
})();
</script>
</body>
</html>
