<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Per Kilo Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6EEDD; --cream-deep:#EFE4CC; --paper:#FFFBF2;
    --ink:#3D342A; --ink-soft:#8A7C68;
    --gold:#B98A2E; --gold-bright:#D4A63C; --gold-pale:#F0E4C4;
    --line:#E5D8BE; --olive:#6E7A4F;
    --shadow:0 1px 2px rgba(61,52,42,.06), 0 8px 24px rgba(61,52,42,.07);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:"DM Sans", system-ui, sans-serif; color:var(--ink);
    background:radial-gradient(1200px 600px at 50% -10%, #FCF6E8 0%, transparent 60%), var(--cream);
    min-height:100vh; padding:32px 16px 64px; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:420px; margin:0 auto; }
  header{ text-align:center; margin-bottom:22px; }
  .eyebrow{ font-size:.72rem; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:6px; }
  h1{ font-family:"Playfair Display", serif; font-weight:600; font-size:2.1rem; margin:0; }
  .rule{ height:2px; width:64px; margin:14px auto 0; background:linear-gradient(90deg, transparent, var(--gold-bright), transparent); }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:20px; margin-bottom:18px; }
  label{ display:block; font-size:.8rem; color:var(--ink-soft); font-weight:600; margin:0 0 6px 2px; }
  .field{ margin-bottom:16px; }
  .field:last-child{ margin-bottom:0; }
  .shell{ position:relative; }
  .shell .pre, .shell .post{ position:absolute; top:50%; transform:translateY(-50%); pointer-events:none; }
  .shell .pre{ left:14px; color:var(--gold); font-weight:600; }
  .shell .post{ right:14px; color:var(--ink-soft); font-size:.9rem; }
  input{
    width:100%; padding:14px 40px 14px 28px; text-align:right;
    font-family:inherit; font-size:1.3rem; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink);
    background:var(--cream); border:1px solid var(--line); border-radius:10px;
  }
  input.no-pre{ padding-left:14px; }
  input:focus{ outline:none; border-color:var(--gold-bright); box-shadow:0 0 0 3px rgba(212,166,60,.18); }

  .result{ background:linear-gradient(180deg, #FFFDF7, #F7EDD5); border:2px solid var(--gold-bright); text-align:center; padding:24px 20px; }
  .r-label{ font-size:.74rem; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; margin-bottom:5px; }
  .r-amount{ font-family:"Playfair Display", serif; font-weight:700; font-size:3rem; line-height:1.05; color:var(--olive); font-variant-numeric:tabular-nums; }
  .r-note{ color:var(--ink-soft); font-size:.86rem; margin-top:7px; }

  .clear{ display:block; margin:0 auto; background:none; border:none; cursor:pointer; color:var(--gold); font-family:inherit; font-weight:600; font-size:.9rem; text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Quick Sum</div>
    <h1>Per Kilo Converter</h1>
    <div class="rule"></div>
  </header>

  <div class="card">
    <div class="field">
      <label for="grams">Pack size</label>
      <div class="shell">
        <input id="grams" class="no-pre" type="number" inputmode="decimal" min="0" placeholder="400" autofocus>
        <span class="post">g</span>
      </div>
    </div>
    <div class="field">
      <label for="price">Price paid</label>
      <div class="shell">
        <span class="pre">$</span>
        <input id="price" type="number" inputmode="decimal" min="0" step="0.01" placeholder="11.99" style="padding-right:14px">
      </div>
    </div>
  </div>

  <div class="card result">
    <div class="r-label">Price per kilo</div>
    <div class="r-amount" id="out">—</div>
    <div class="r-note" id="note">Enter the pack size and price.</div>
  </div>

  <button class="clear" id="clear">Clear</button>
</div>

<script>
  const g = document.getElementById("grams");
  const p = document.getElementById("price");
  const out = document.getElementById("out");
  const note = document.getElementById("note");
  const nzd = new Intl.NumberFormat("en-NZ", { style:"currency", currency:"NZD" });

  function calc(){
    const grams = parseFloat(g.value), price = parseFloat(p.value);
    if(grams > 0 && price >= 0){
      out.textContent = nzd.format(price / grams * 1000);
      note.textContent = nzd.format(price) + " for " + grams + " g";
    } else {
      out.textContent = "—";
      note.textContent = "Enter the pack size and price.";
    }
  }
  g.addEventListener("input", calc);
  p.addEventListener("input", calc);
  document.getElementById("clear").addEventListener("click", () => { g.value = ""; p.value = ""; calc(); g.focus(); });
</script>
</body>
</html>
