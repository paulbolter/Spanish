<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available — NZD</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --border: #23262d;
    --muted: #3a3f4a;
    --text: #e8eaf0;
    --subtext: #7a8090;
    --green: #3dd68c;
    --blue: #4a9eff;
    --red: #ff5c5c;
    --btc: #f7931a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 32px 24px;
    max-width: 700px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 36px;
  }

  .header-title {
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--subtext);
    margin-bottom: 4px;
  }

  .header-date {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(61, 214, 140, 0.08);
    border: 1px solid rgba(61, 214, 140, 0.2);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11px;
    color: var(--green);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Save bar */
  .save-bar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    margin-bottom: 20px;
  }

  .save-btn {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: rgba(61, 214, 140, 0.1);
    border: 1px solid rgba(61, 214, 140, 0.3);
    color: var(--green);
    padding: 7px 18px;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .save-btn:hover { background: rgba(61, 214, 140, 0.2); }

  .save-status {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    transition: color 0.4s;
  }

  .save-status.flash { color: var(--green); }

  /* BTC Hero */
  .btc-hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 20px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .btc-hero::before {
    content: '₿';
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 130px;
    color: rgba(247, 147, 26, 0.04);
    font-weight: bold;
    line-height: 1;
    pointer-events: none;
  }

  .btc-label {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--subtext);
    margin-bottom: 8px;
  }

  .price-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: 'DM Mono', monospace;
  }

  .price-row + .price-row { margin-top: 6px; }

  .price-tag {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    width: 34px;
  }

  .price-main {
    font-size: 34px;
    font-weight: 500;
    color: var(--btc);
    letter-spacing: -0.02em;
  }

  .price-secondary {
    font-size: 22px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .btc-change {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--green);
    margin-top: 10px;
  }

  .btc-right { text-align: right; position: relative; }

  .btc-holdings-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--subtext);
    margin-bottom: 6px;
  }

  .value-row {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 8px;
    font-family: 'DM Mono', monospace;
  }

  .value-row + .value-row { margin-top: 4px; }

  .value-main {
    font-size: 26px;
    color: var(--text);
  }

  .value-secondary {
    font-size: 17px;
    color: var(--subtext);
  }

  .btc-amount-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 10px;
  }

  .btc-amount-label {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--subtext);
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 20px;
  }

  .card-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--subtext);
    margin-bottom: 14px;
  }

  .card-total {
    font-family: 'DM Mono', monospace;
    font-size: 26px;
    font-weight: 500;
    margin-bottom: 16px;
    color: var(--green);
  }

  .edit-hint {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-bottom: 10px;
    margin-top: -8px;
  }

  .line-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-top: 1px solid var(--border);
  }

  .line-item:first-of-type {
    border-top: 1px solid var(--muted);
  }

  .line-name {
    font-size: 13px;
    color: var(--subtext);
  }

  .currency-tag {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-right: 2px;
  }

  .editable-value {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    background: none;
    border: none;
    outline: none;
    text-align: right;
    width: 100px;
    cursor: pointer;
    border-bottom: 1px dashed transparent;
    transition: border-color 0.2s, background 0.2s;
    padding: 2px 4px;
    border-radius: 4px;
  }

  .editable-value:hover {
    border-bottom-color: var(--muted);
  }

  .editable-value:focus {
    background: rgba(74, 158, 255, 0.08);
    border-bottom-color: var(--blue);
    color: var(--blue);
  }

  /* Totals bar */
  .total-bar {
    background: linear-gradient(135deg, #1a1d24, #1e2128);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 32px;
    text-align: center;
  }

  .total-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--subtext);
    margin-bottom: 8px;
  }

  .total-value {
    font-family: 'DM Mono', monospace;
    font-size: 34px;
    font-weight: 500;
    color: var(--green);
  }

  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  @media (max-width: 700px) {
    .btc-hero { flex-direction: column; gap: 20px; }
    .btc-right { text-align: left; }
    .value-row { justify-content: flex-start; }
    .btc-amount-row { justify-content: flex-start; }
    .price-main { font-size: 28px; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div>
    <div class="header-title">Available — NZD</div>
    <div class="header-date" id="dateDisplay">—</div>
  </div>
  <div class="live-badge">
    <div class="live-dot"></div>
    BTC Live
  </div>
</div>

<!-- Save Bar -->
<div class="save-bar">
  <span class="save-status" id="saveStatus">—</span>
  <button class="save-btn" onclick="saveData()">💾 Save Data</button>
</div>

<!-- BTC Hero -->
<div class="btc-hero">
  <div>
    <div class="btc-label">Bitcoin Price</div>
    <div class="price-row">
      <span class="price-tag">USD</span>
      <span class="price-main">$<span id="btcPriceUsd">—</span></span>
    </div>
    <div class="price-row">
      <span class="price-tag">NZD</span>
      <span class="price-secondary">$<span id="btcPriceNzd">—</span></span>
    </div>
    <div class="btc-change" id="btcChange">fetching price...</div>
  </div>
  <div class="btc-right">
    <div class="btc-holdings-label">My BTC Value</div>
    <div class="value-row">
      <span class="price-tag">USD</span>
      <span class="value-main" id="btcHoldingUsd">$—</span>
    </div>
    <div class="value-row">
      <span class="price-tag">NZD</span>
      <span class="value-secondary" id="btcHoldingNzd">$—</span>
    </div>
    <div class="btc-amount-row">
      <span class="btc-amount-label">Holdings:</span>
      <input class="editable-value" id="btcAmount" value="5.6" style="width:70px; font-size:13px;" title="Click to edit your BTC amount"> BTC
    </div>
  </div>
</div>

<!-- NZD Accounts -->
<div class="card">
  <div class="card-label">NZD Accounts</div>
  <div class="card-total" id="nzdTotal">$—</div>
  <div class="edit-hint">✎ click any value to edit</div>
  <div class="line-item">
    <span class="line-name">Kiwi Cash <span class="currency-tag">NZD</span></span>
    <input class="editable-value" id="kiwicash" value="177" title="NZD amount">
  </div>
  <div class="line-item">
    <span class="line-name">Kiwi Visa <span class="currency-tag">NZD</span></span>
    <input class="editable-value" id="kiwivisa" value="16473" title="NZD amount">
  </div>
</div>

<!-- Total -->
<div class="total-bar">
  <div class="total-label">Current Available (NZD)</div>
  <div class="total-value" id="currentAvailable">$—</div>
</div>

<div class="footer" id="lastUpdated">BTC price updates every 60 seconds</div>

<script>
// ─── BTC PRICE ───────────────────────────────────────────────────────
let btcUsd = 0;
let btcNzd = 0;

async function fetchBTC() {
  try {
    const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,nzd&include_24hr_change=true');
    const data = await res.json();
    btcUsd = data.bitcoin.usd;
    btcNzd = data.bitcoin.nzd;
    const change = data.bitcoin.usd_24h_change;

    document.getElementById('btcPriceUsd').textContent = btcUsd.toLocaleString('en-US');
    document.getElementById('btcPriceNzd').textContent = Math.round(btcNzd).toLocaleString('en-US');

    const changeEl = document.getElementById('btcChange');
    changeEl.textContent = (change >= 0 ? '▲ +' : '▼ ') + change.toFixed(2) + '% (24h)';
    changeEl.style.color = change >= 0 ? 'var(--green)' : 'var(--red)';

    document.getElementById('lastUpdated').textContent =
      'BTC price last updated: ' + new Date().toLocaleTimeString('en-NZ');

    recalculate();
  } catch(e) {
    document.getElementById('btcChange').textContent = 'price unavailable — check connection';
    document.getElementById('btcChange').style.color = 'var(--muted)';
  }
}

// ─── RECALCULATE ─────────────────────────────────────────────────────
function getVal(id) {
  const el = document.getElementById(id);
  return parseFloat(el.value.replace(/,/g, '')) || 0;
}

function fmt(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}

function recalculate() {
  // BTC holdings value in both currencies
  const btcAmt = getVal('btcAmount');
  document.getElementById('btcHoldingUsd').textContent = fmt(btcAmt * btcUsd);
  document.getElementById('btcHoldingNzd').textContent = fmt(btcAmt * btcNzd);

  // NZD accounts (native NZD, no conversion)
  const nzdTotal = getVal('kiwicash') + getVal('kiwivisa');
  document.getElementById('nzdTotal').textContent = fmt(nzdTotal);

  // Current Available = NZD accounts only
  document.getElementById('currentAvailable').textContent = fmt(nzdTotal);
}

// ─── SAVE & LOAD ─────────────────────────────────────────────────────
const SAVE_KEY = 'available_nzd_v1';

function saveData() {
  const inputs = ['btcAmount','kiwicash','kiwivisa'];
  const values = {};
  inputs.forEach(id => { values[id] = document.getElementById(id).value; });

  localStorage.setItem(SAVE_KEY, JSON.stringify({
    values,
    savedAt: new Date().toISOString()
  }));

  const status = document.getElementById('saveStatus');
  status.textContent = '✓ saved at ' + new Date().toLocaleTimeString('en-NZ');
  status.classList.add('flash');
  setTimeout(() => status.classList.remove('flash'), 2000);
}

function loadData() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) {
    document.getElementById('saveStatus').textContent = 'no saved data yet';
    return;
  }
  try {
    const payload = JSON.parse(raw);
    Object.entries(payload.values).forEach(([id, val]) => {
      const el = document.getElementById(id);
      if (el) el.value = val;
    });
    const when = new Date(payload.savedAt).toLocaleDateString('en-NZ', {
      day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    document.getElementById('saveStatus').textContent = 'loaded · last saved ' + when;
  } catch(e) {
    document.getElementById('saveStatus').textContent = 'could not load saved data';
  }
}

// ─── EDITABLE INPUTS ─────────────────────────────────────────────────
document.querySelectorAll('.editable-value').forEach(input => {
  input.addEventListener('input', recalculate);
  input.addEventListener('change', saveData);
  input.addEventListener('focus', function() { this.select(); });
});

// ─── DATE ────────────────────────────────────────────────────────────
document.getElementById('dateDisplay').textContent =
  new Date().toLocaleDateString('en-NZ', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

// ─── INIT ────────────────────────────────────────────────────────────
loadData();
fetchBTC();
setInterval(fetchBTC, 60000);
</script>
</body>
</html>
